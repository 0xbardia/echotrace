[project]
name = "echotrace"
version = "1.0.0"
description = "Consensus source-independence registry for GenLayer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[dependency-groups]
test = [
  "cloudpickle==3.1.2",
  "genlayer-py==0.16.3",
  "genlayer-test==0.29.2",
  "genvm-linter==0.11.0",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
